<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Drawing Board</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;color:#302746;background:#f7f4ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{transition:transform .18s,background .18s,box-shadow .18s}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bba0fa;outline-offset:2px}.app{display:flex;min-height:100dvh;padding:15px;gap:16px;background:radial-gradient(ellipse at 90% 0%,#ffe7f5 0,transparent 35%),radial-gradient(ellipse at 0% 100%,#e3eaff 0,transparent 38%),#f7f5ff}.sidebar{width:320px;flex-shrink:0;background:#ffffffed;border:1px solid #fff;border-radius:24px;padding:22px;overflow:auto;max-height:calc(100dvh - 30px);box-shadow:0 14px 50px #65528a14;scrollbar-width:thin}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:49px;height:49px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(140deg,#eee0ff,#ffddeb);font-size:26px;box-shadow:0 5px 15px #a98bc02c}h1{font-family:Outfit,system-ui;font-size:23px;letter-spacing:-.7px;margin:0;color:#49317c}.sub{font-size:12px;color:#9487a8;margin-top:3px}.section{border-top:1px solid #f0eafa;padding:18px 0}.section:first-of-type{margin-top:20px}h2{font-family:Outfit,system-ui;font-size:14px;margin:0 0 13px;display:flex;align-items:center;gap:7px;color:#49376d}.section h2:before{content:'✦';color:#b28af0}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{min-height:57px;border:1px solid #ece6f6;background:#faf9ff;border-radius:14px;padding:8px 4px;font-size:11px;cursor:pointer;color:#645776}.tool.active{background:linear-gradient(145deg,#e9ddff,#f9eaff);border-color:#a58aeb;color:#6540b4;font-weight:800;box-shadow:0 4px 12px #9475d22b}.tool:hover{background:#f0eaff}label{display:block;font-size:12px;margin:13px 0 7px;color:#6b607d;font-weight:600}input[type=range]{width:100%;accent-color:#9c73e5;cursor:pointer}input[type=color]{width:100%;height:39px;border:1px solid #e9e1f6;border-radius:10px;background:#fff;padding:4px;cursor:pointer}.colors{display:flex;flex-wrap:wrap;gap:9px}.swatch{width:29px;height:29px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #e3d8ee;cursor:pointer}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.row label{display:flex;gap:6px;align-items:center;background:#f8f5ff;padding:10px;border-radius:11px;flex:1}input[type=checkbox]{accent-color:#9873df}select,input[type=number]{border:1px solid #e8dff4;border-radius:11px;padding:10px;background:#fbfaff;width:100%;color:#514267} .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.action{background:#f9f6ff;border:1px solid #e6dbf5;padding:11px 10px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:700;color:#66517e}.primary{background:linear-gradient(120deg,#8661dd,#b185ec);color:white;border:0;box-shadow:0 6px 17px #8961d73b}.action.primary{grid-column:span 2;padding:14px;font-size:14px}.workspace{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#ffffffa6;border:1px solid white;border-radius:25px;box-shadow:0 14px 50px #65528a0b}.topbar{padding:19px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #f1ebf7}.topbar strong{font-family:Outfit,system-ui;font-size:20px;color:#4c377a}.topbar strong:before{content:'✦ ';color:#b48eea}.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:36px;min-height:400px;background-color:#f9f7fe;background-image:radial-gradient(#e1d8ef 1.1px,transparent 1.1px);background-size:23px 23px}#canvas{display:block;background:white;box-shadow:0 17px 50px #47316a21,0 0 0 7px #ffffffa8;touch-action:none;max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;cursor:crosshair;border-radius:3px}.hint{font-size:12px;color:#8d80a1;background:#f8f4ff;border:1px solid #efe6fc;border-radius:30px;padding:9px 14px}.bottom-bar{padding:13px 23px;background:#fff;border-top:1px solid #f0eafa;display:flex;justify-content:space-between;align-items:center;color:#9789aa;font-size:12px}.bottom-bar span:last-child{color:#a37be2;font-weight:700}#preview{width:100%;height:52px;border:1px dashed #d5c3ef;border-radius:12px;background:#fcfaff}.tiny{font-size:11px;color:#aa9ab9;margin-top:10px;text-align:center}@media(max-width:800px){.app{flex-direction:column;padding:9px;gap:9px}.sidebar{width:100%;max-height:none;overflow:visible;padding:16px;border-radius:20px}.workspace{min-height:60dvh;border-radius:20px;order:-1}.canvas-wrap{min-height:45dvh;padding:16px}#canvas{max-height:55dvh}.topbar{padding:13px 16px}.topbar strong{font-size:17px}.hint{font-size:10px;padding:7px}.section{padding:14px 0}.tools{grid-template-columns:repeat(5,1fr)}.tool{min-height:53px}.bottom-bar{padding:10px 15px}}@media(max-width:420px){.tools{grid-template-columns:repeat(3,1fr)}.topbar{flex-wrap:wrap}.hint{white-space:normal}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">🎨</div><div><h1>Dreamy Doodle</h1><div class="sub">Your little creative corner ✨</div></div></div><div class="section"><h2>Drawing tools</h2><div class="tools" id="tools"></div></div><div class="section"><h2>Brush colour</h2><div class="colors" id="colors"></div><label>Custom colour</label><input type="color" id="color" value="#7654d0"><label>Brush size: <b id="sizeLabel">8</b> px</label><input id="size" type="range" min="1" max="80" value="8"><label>Opacity: <b id="opacityLabel">100</b>%</label><input id="opacity" type="range" min="5" max="100" value="100"><label>Brush preview</label><canvas id="preview" width="235" height="48"></canvas></div><div class="section"><h2>Brush effects</h2><div class="row"><label><input type="checkbox" id="glow"> Glow</label><label><input type="checkbox" id="mirror"> Mirror</label></div></div><div class="section"><h2>Canvas settings</h2><label>Background</label><select id="background"><option value="white">White</option><option value="transparent">Transparent</option><option value="#fdf4ff">Light pink</option><option value="#f1f5ff">Light blue</option><option value="#1d1930">Dark</option></select><label>Canvas dimensions (px)</label><div class="row"><input type="number" id="width" value="1200" min="100" max="4000" aria-label="Width"><span>×</span><input type="number" id="height" value="750" min="100" max="4000" aria-label="Height"></div><button class="action" id="resize" style="margin-top:9px">Apply canvas size</button></div><div class="section"><h2>History & export</h2><div class="actions"><button class="action" id="undo">↶ Undo</button><button class="action" id="redo">↷ Redo</button><button class="action" id="clear">Clear</button><button class="action primary" id="save">↓ Download your artwork · PNG</button></div></div></aside><main class="workspace"><div class="topbar"><strong>My Canvas ✨</strong><span class="hint">Draw with finger, stylus or mouse</span></div><div class="canvas-wrap"><canvas id="canvas" width="1200" height="750"></canvas></div><div class="bottom-bar"><span>✏️ Make a little magic, one stroke at a time</span><span id="canvasInfo">1200 × 750 px</span></div></main></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),preview=document.getElementById('preview'),pctx=preview.getContext('2d');let tool='pen',drawing=false,start=null,last=null,base=null,history=[],index=-1;const names=[['pen','✏️ Pen'],['pencil','✎ Pencil'],['marker','🖊 Marker'],['highlighter','🖍 Highlight'],['airbrush','☁ Airbrush'],['glitter','✨ Glitter'],['rainbow','🌈 Rainbow'],['eraser','⌫ Eraser'],['line','╱ Line'],['rectangle','▭ Rectangle'],['circle','◯ Circle'],['triangle','△ Triangle'],['arrow','➜ Arrow'],['star','☆ Star'],['heart','♡ Heart']];const $=id=>document.getElementById(id);names.forEach(([id,label])=>{const b=document.createElement('button');b.className='tool'+(id==='pen'?' active':'');b.textContent=label;b.dataset.tool=id;b.onclick=()=>{tool=id;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));updatePreview()};$('tools').append(b)});['#7654d0','#f29db9','#ffb86c','#f7d86b','#78caa8','#72b8f3','#302a43','#ffffff','#ff537d','#9a78ec'].forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.onclick=()=>{$('color').value=c;updatePreview()};$('colors').append(b)});function options(){return {color:$('color').value,size:+$('size').value,alpha:+$('opacity').value/100,glow:$('glow').checked,mirror:$('mirror').checked}}function setup(c,o){c.globalAlpha=o.alpha;c.lineWidth=o.size;c.lineCap='round';c.lineJoin='round';c.strokeStyle=o.color;c.fillStyle=o.color;c.shadowBlur=o.glow?o.size*1.6:0;c.shadowColor=o.color;if(tool==='pencil'){c.globalAlpha*=.65;c.lineWidth=Math.max(1,o.size*.45)}if(tool==='marker')c.lineWidth=o.size*1.7;if(tool==='highlighter'){c.globalAlpha*=.3;c.lineWidth=o.size*3}if(tool==='airbrush'){c.globalAlpha*=.2;c.shadowBlur=o.size*2.5;c.lineWidth=o.size*1.7}if(tool==='eraser'){c.globalCompositeOperation='destination-out';c.globalAlpha=1;c.lineWidth=o.size*2;c.shadowBlur=0}}
function stroke(a,b,o){ctx.save();setup(ctx,o);if(tool==='rainbow'){ctx.strokeStyle=`hsl(${(Date.now()/12+a.x/3)%360},95%,55%)`}ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(tool==='glitter'){ctx.shadowBlur=0;for(let i=0;i<4;i++){let x=b.x+(Math.random()-.5)*o.size*3,y=b.y+(Math.random()-.5)*o.size*3;ctx.globalAlpha=Math.random()*.7+.3;ctx.fillRect(x,y,Math.max(1,o.size/5),Math.max(1,o.size/5))}}ctx.restore();if(o.mirror){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);setup(ctx,o);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}}
function shape(a,b,o){ctx.save();setup(ctx,o);const x=a.x,y=a.y,w=b.x-x,h=b.y-y,cx=(x+b.x)/2,cy=(y+b.y)/2;ctx.beginPath();if(tool==='line'){ctx.moveTo(x,y);ctx.lineTo(b.x,b.y)}else if(tool==='rectangle'){ctx.rect(x,y,w,h)}else if(tool==='circle'){ctx.ellipse(cx,cy,Math.max(1,Math.abs(w)/2),Math.max(1,Math.abs(h)/2),0,0,Math.PI*2)}else if(tool==='triangle'){ctx.moveTo(cx,y);ctx.lineTo(b.x,b.y);ctx.lineTo(x,b.y);ctx.closePath()}else if(tool==='arrow'){ctx.moveTo(x,y);ctx.lineTo(b.x,b.y);let angle=Math.atan2(h,w),len=Math.min(35,Math.max(12,o.size*3));ctx.moveTo(b.x-len*Math.cos(angle-.5),b.y-len*Math.sin(angle-.5));ctx.lineTo(b.x,b.y);ctx.lineTo(b.x-len*Math.cos(angle+.5),b.y-len*Math.sin(angle+.5))}else{let n=tool==='star'?10:100; if(tool==='star'){let outer=Math.min(Math.abs(w),Math.abs(h))/2,inner=outer*.45;for(let i=0;i<n;i++){let t=-Math.PI/2+i*Math.PI/5,r=i%2?inner:outer;let px=cx+Math.cos(t)*r,py=cy+Math.sin(t)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}else{let scaleX=w/2,scaleY=h/2;for(let i=0;i<=100;i++){let t=i/100*Math.PI*2,xx=16*Math.sin(t)**3/18,yy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/18;i?ctx.lineTo(cx+xx*scaleX,cy+yy*scaleY):ctx.moveTo(cx+xx*scaleX,cy+yy*scaleY)}ctx.closePath()}}ctx.stroke();ctx.restore()}
function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function snapshot(){history=history.slice(0,index+1);history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>30)history.shift();index=history.length-1}function restore(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.putImageData(history[index],0,0)}function bg(){ctx.clearRect(0,0,canvas.width,canvas.height);if($('background').value!=='transparent'){ctx.fillStyle=$('background').value;ctx.fillRect(0,0,canvas.width,canvas.height)}}bg();snapshot();canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;start=last=pos(e);base=ctx.getImageData(0,0,canvas.width,canvas.height);if(names.slice(0,8).some(n=>n[0]===tool))stroke(start,start,options())});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=pos(e),o=options();if(names.slice(8).some(n=>n[0]===tool)){ctx.putImageData(base,0,0);shape(start,p,o)}else stroke(last,p,o);last=p});function end(){if(!drawing)return;drawing=false;snapshot()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);$('undo').onclick=()=>{if(index>0){index--;restore()}};$('redo').onclick=()=>{if(index<history.length-1){index++;restore()}};$('clear').onclick=()=>{if(confirm('Clear the whole canvas?')){bg();snapshot()}};$('resize').onclick=()=>{let w=+$('width').value,h=+$('height').value;if(w<100||h<100||w>4000||h>4000)return alert('Use dimensions between 100 and 4000 pixels.');if(!confirm('Changing canvas size will clear your drawing. Continue?'))return;canvas.width=w;canvas.height=h;$('canvasInfo').textContent=w+' × '+h+' px';history=[];index=-1;bg();snapshot()};$('background').onchange=()=>{if(confirm('Change background and clear drawing?')){bg();snapshot()}};$('save').onclick=()=>{let a=document.createElement('a');let filename=prompt('Name your artwork (PNG):','my-drawing');if(filename===null)return;filename=(filename.trim()||'my-drawing').replace(/[\\/:*?"<>|]/g,'-');a.download=filename.replace(/\.png$/i,'')+'.png';a.href=canvas.toDataURL('image/png');a.click()};function updatePreview(){let o=options();$('sizeLabel').textContent=o.size;$('opacityLabel').textContent=Math.round(o.alpha*100);pctx.clearRect(0,0,235,48);pctx.save();pctx.lineWidth=Math.min(o.size,35);pctx.lineCap='round';pctx.strokeStyle=o.color;pctx.globalAlpha=o.alpha;pctx.shadowColor=o.color;pctx.shadowBlur=o.glow?15:0;pctx.beginPath();pctx.moveTo(25,28);pctx.bezierCurveTo(70,3,140,46,210,20);pctx.stroke();pctx.restore()}['color','size','opacity','glow','mirror'].forEach(id=>$(id).addEventListener('input',updatePreview));updatePreview();
</script></body></html>
